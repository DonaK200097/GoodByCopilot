name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey v2
        shell: pwsh
        run: |
          $version = "2.0.19"
          $zip = "AutoHotkey_$version.zip"
          $installRoot = Join-Path $env:ProgramFiles "AutoHotkey"
          Invoke-WebRequest -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$version/$zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $installRoot -Force

      - name: Compile AHK v2 binaries
        shell: pwsh
        run: |
          $compiler = Join-Path $env:ProgramFiles "AutoHotkey\Compiler\Ahk2Exe.exe"
          if (-not (Test-Path -LiteralPath $compiler)) {
            throw "Compiler not found: $compiler"
          }

          & $compiler /in "GoodByCopilot.ahk" /out "GoodByCopilot.exe"
          & $compiler /in "Core\CoreGBC.ahk" /out "CoreGBC.exe"

      - name: Build release zip
        shell: pwsh
        run: .\scripts\build-release.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GoodByCopilot-release.zip
