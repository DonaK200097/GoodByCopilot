name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey v2
        shell: pwsh
        run: |
          $version = "2.0.19"
          $zip = "AutoHotkey_$version.zip"
          $installRoot = Join-Path $env:ProgramFiles "AutoHotkey"
          Invoke-WebRequest -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$version/$zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $installRoot -Force

          $ahk2exeRelease = Invoke-RestMethod -Headers @{ "User-Agent" = "GitHubActions" } -Uri "https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest"
          $ahk2exeAsset = $ahk2exeRelease.assets | Where-Object { $_.name -like "Ahk2Exe*.exe" } | Select-Object -First 1
          if (-not $ahk2exeAsset) {
            throw "Could not find an Ahk2Exe exe asset in the latest release."
          }

          $compilerDir = Join-Path $installRoot "Compiler"
          New-Item -ItemType Directory -Force -Path $compilerDir | Out-Null
          Invoke-WebRequest -Uri $ahk2exeAsset.browser_download_url -OutFile (Join-Path $compilerDir "Ahk2Exe.exe")

      - name: Compile AHK v2 binaries
        shell: pwsh
        run: |
          $compiler = Join-Path $env:ProgramFiles "AutoHotkey\Compiler\Ahk2Exe.exe"
          if (-not (Test-Path -LiteralPath $compiler)) {
            throw "Compiler not found: $compiler"
          }
          $base = Join-Path $env:ProgramFiles "AutoHotkey\AutoHotkey64.exe"
          if (-not (Test-Path -LiteralPath $base)) {
            throw "Base executable not found: $base"
          }

          & $compiler /in "GoodByCopilot.ahk" /out "GoodByCopilot.exe" /base "$base"
          & $compiler /in "Core\CoreGBC.ahk" /out "CoreGBC.exe" /base "$base"

      - name: Build release zip
        shell: pwsh
        run: .\scripts\build-release.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GoodByCopilot-release.zip
